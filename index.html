<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linus Hub</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1b1340, #05070d);
      color: #fff;
      overflow-x: hidden;
    }

    /* ===== NAV ===== */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(14px);
      background: rgba(0,0,0,0.35);
      z-index: 1000;
    }

    nav h1 {
      font-weight: 700;
      font-size: 20px;
    }

    nav .btns button {
      margin-left: 10px;
      padding: 8px 18px;
      border-radius: 999px;
      border: none;
      background: rgba(255,255,255,0.08);
      color: #fff;
      cursor: pointer;
      transition: 0.25s;
    }

    nav .btns button:hover {
      background: rgba(255,255,255,0.18);
    }

    /* ===== HERO ===== */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-top: 100px;
    }

    .hero-box {
      max-width: 850px;
      animation: fadeUp 1s ease forwards;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      margin: auto;
      background: url('https://i.imgur.com/4Z7Z6vR.jpeg') center/cover;
      border: 3px solid #7c6cff;
      box-shadow: 0 0 40px rgba(124,108,255,0.5);
    }

    .hero h2 {
      font-size: 54px;
      margin-top: 30px;
      font-weight: 700;
    }

    .hero p {
      margin-top: 18px;
      color: #cfcfff;
      line-height: 1.7;
      font-size: 18px;
    }

    .tags {
      margin-top: 30px;
    }

    .tag {
      display: inline-block;
      padding: 10px 20px;
      margin: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
    }

    /* ===== SECTIONS ===== */
    section {
      padding: 80px 8%;
    }

    h3 {
      font-size: 32px;
      margin-bottom: 40px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 26px;
    }

    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 26px;
      transition: 0.35s;
      transform-style: preserve-3d;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.03);
      background: rgba(255,255,255,0.12);
    }

    .card h4 {
      margin-bottom: 8px;
    }

    .card p {
      color: #d6d6ff;
      font-size: 15px;
    }

    /* ===== PARTICLES ===== */
    canvas {
      position: fixed;
      inset: 0;
      z-index: -1;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<canvas id="stars"></canvas>

<nav>
  <h1>Linus.dev</h1>
  <div class="btns">
    <button>Work</button>
    <button>Socials</button>
  </div>
</nav>

<div class="hero">
  <div class="hero-box">
    <div class="avatar"></div>
    <h2>Hey, I'm Linus 👋</h2>
    <p>
      I Am a entrepreneur, website creator, coder and investor<br>
      This is my personal site
    </p>

    <div class="tags">
      <span class="tag">Frontend</span>
      <span class="tag">Animations</span>
      <span class="tag">Three.js</span>
      <span class="tag">Open Source</span>
    </div>
  </div>
</div>

<section>
  <h3>Featured Work</h3>
  <div class="grid">
    <div class="card">
      <h4>Iptools</h4>
      <p>Iptools is a lightweight network scanne</p>
    </div>
    <div class="card">
      <h4>Lofi radio</h4>
      <p>A lofi music player website</p>
    </div>
    <div class="card">
      <h4>Comming soon</h4>
      <p>Coming soon</p>
    </div>
  </div>
</section>

<script>
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const stars = Array.from({ length: 140 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.5 + 0.3,
    s: Math.random() * 0.3 + 0.05
  }));

  function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#8aa2ff';

    for (const s of stars) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();

      s.y += s.s;
      if (s.y > canvas.height) s.y = 0;
    }

    requestAnimationFrame(animate);
  }

  animate();
</script>

</body>
</html>
